[flake8]
max-line-length = 88
extend-ignore = E203


[tool:pytest]
testpaths = tests
# tests/ha imports custom_components.rltech_fttr as a package.
pythonpath = .
# pytest-homeassistant-custom-component provides async autouse fixtures
# (event loop configuration); auto mode lets pytest-asyncio run them for the
# plain synchronous tests as well. Harmless in the plain venv.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
