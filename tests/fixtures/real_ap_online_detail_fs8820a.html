<!--
REAL SAMPLE (sanitized) - RLTech AC 8080 Web UI, captured 2026-09-29 (phase 0) from WAN http://<AC-WAN>:8080.
Source page: /cgi-bin/ap_online_detail.asp   Capture: GET ?param1=<MAC>_<SN>&param2=<SN> for AP-A; list_pon result 0 with data as JSON string
Firmware: AC hw V0.1.0 / sw V0.0.30 (lan_num=6, lan_pon_num=2); APs FS8820A V0.1.21, RL820GW-AX3 V0.0.51.
Page content is byte-for-byte what boa returned except for these substitutions (same rules in every real_* file):
  - Vendor OUI E0:21:FE kept; the device-specific (NIC) part of each MAC is replaced:
      AP-A (FS8820A)      -> E0:21:FE:A0:A0:0x  (base MAC ..:00, BSSIDs ..:04/..:05)
      AP-B (RL820GW-AX3)  -> E0:21:FE:B0:B0:0x
      AC (LAN ..:00, WAN ..:02) -> E0:21:FE:C0:C0:0x
    The same NIC substitution is applied everywhere the MAC is embedded: PON SN (RLGMFEA0A000 /
    RLGMFEB0B000, sn_address RLGM-FEA0A000), DevName/HostName (FTTRSub_A0A000 / FTTRSub_B0B000),
    EUI-64 IPv6 (...:fea0:a000). Upper/lower case and colon/no-colon style of the original are kept.
  - Other (client) MACs -> 02:00:00:00:00:NN, numbered in first-seen order across all real_* files.
  - DevSN: AP-A -> RLGM00000000001, AP-B -> RL00000000002; AC serial -> RL0000000000003 (lengths kept).
  - IPv4: AC LAN /24 -> 192.0.2.X, AC WAN /24 -> 198.51.100.X, AP-A mgmt /24 -> 203.0.113.X
    (last octet kept, so AP-B = 192.0.2.10, AP-A = 192.0.2.4, AC LAN = 192.0.2.1). Masks kept.
  - Client IPv6 link-local (other than fe80::1) -> fe80::2:0:0:NN.
  - UUIDs (AP Fingerprint, task SeqId) -> 00000000-0000-4000-8000-0000000000NN.
  - Client host names -> client-host-NN; SSID -> TEST_SSID / TEST_SSID_5G.
  - No ecntToken, cookie or password appears in these pages (checked); nothing else was removed.
-->

var lan_num = '6';
var lan_pon_num = '2';
var isFttrMainDevice = 'Yes';
if (isFttrMainDevice == "Yes") {
    if (lan_pon_num == "N/A") {
        lan_pon_num = "1";
    }
} else {
    lan_pon_num = "0";
}
var eth_lan_num = parseInt(lan_num) - parseInt(lan_pon_num);
var list_ap ='{ "respCode":0, "data":{ "Model":"FS8820A", "IP":"192.0.2.4", "Version":"V0.1.21", "Mac":"E021FEA0A000", "Status":"1", "Profile":"Default", "ChannelG24":"3", "ChannelG5":"36", "Assoc":"1", "Alias":"", "SN":"RLGMFEA0A000", "Uplink":"2", "UplinkPort":"6", "Fingerprint":"00000000-0000-4000-8000-000000000002", "LastOfflineReason":"", "BssidG24":"E021FEA0A004", "BssidG5":"E021FEA0A005", "SysDuration":"5878566", "RamSize":"536870912", "FlashSize":"268435456", "DevName":"FTTRSub_A0A000", "CPUUsage":"5", "CPUTemp":"63", "MEMUsage":"38", "FlashUsage":"86", "DevSN":"RLGM00000000001", "UpgradeFlag":"1", "ProfileIdx":"1", "OptTxPower":"", "OptRxPower":"" } } '
var ap_list_info = JSON.parse(list_ap)
let list_pon = '{ "result": 0, "data": "{ \"pon_id\": 2, \"onu_id\": 0, \"pon_sn\": \"RLGMFEA0A000\", \"opt_temperature\": \" 58.93\", \"opt_current\": \" 11.62\", \"opt_voltage\": \"  3.24\", \"opt_tx_power\": \"  2.43\", \"opt_rx_power\": \"-15.07\", \"active\": 1, \"onu_status\": \"online\", \"ont_distance\": 158, \"opt_err_status\": 0, \"last_up_time\": \"2026-09-15 17:32:21\", \"last_down_time\": \"-\", \"last_dying_gasptime\": \"-\", \"last_down_cause\": \"FiberBroken\", \"dnopt_rx_power\": \"-15.55\", \"identify_vendor\": \"RLGM\", \"equipment_id\": \"FS8820A\", \"sn_address\": \"RLGM-FEA0A000\", \"hardware_version\": \"N\\/A\", \"software_version\": \"V0.1.21\", \"fireware_version\": \"N\\/A\" }" } ';
let modifiedStr = list_pon.replace(/"({[^{}]+})"/g, '$1');
var ap_list_pon = JSON.parse(modifiedStr);
window.onunload = function() //当子页面关闭时可以自动刷新父页面
{
    window.opener.submits();
}


if ( param2 ==null )
{
    window.returnValue=false;
    window.close();
}


function cancelIt() 
{
    window.returnValue=false;
    window.close();
}
</SCRIPT>
