<!--
SYNTHETIC fixture (NOT a device capture): sta-network.asp, pure GPON mode
(TransMode not ActiveEtherWan, so no EthernetState override of PonState),
without fibre. Built from the git_FTTR SDK template
apps/private/webPage/Router/e8c_ml_new_utf8/boaroot/cgi-bin/sta-network.asp
like sta_network_link_up.html, with the no-light raw values seen on site
(TxPower/RxPower '1', SupplyVoltage '0'), phyStatus 'down', LinkSta '0',
trafficstate 'down' and XPON_LinkCfg.Mode '1' (GPON). get_pontype(): SFP choose
'No', ActiveEtherWan 'No', ae_wan_speed 'N/A'. Expected: link type GPON,
online status offline, no optical values.
-->
<HTML><HEAD><TITLE>网络侧信息</TITLE>
<META http-equiv=Content-Language content=zh-cn>
<META http-equiv=Content-Type content="text/html; charset=utf8">

<SCRIPT language=javascript src="/JS/util.js"></SCRIPT>
</HEAD>

<div class="card-body tab-content">
      <SCRIPT language=JavaScript type=text/javascript>
		function transTemperature(temperature)
		{
			var temp = Number(temperature);
			if (temp >= Math.pow(2, 15)){
				return -((Math.pow(2, 16)-temp)/256).toFixed(1);
			}else{
				return (temp/256).toFixed(1);
			}
		}

		function formatSeconds(value) {
		 var theTime = parseInt(value);
		 var result = '';
		 if(theTime > 0){
		  result = ""+parseInt(theTime)+"秒";
		 }
		 return result;
		}

		function PonInfoClass()
		{
			var SupplyVoltage = '0';
			var TxBiasCurrent = '0';
			var Temperature = '0';
			var TxPower = '1';
			var RxPower = '1';
			this.LinkSta					= '0';
			this.trafficstate			= 'down';
			this.fecState					= '1';
			this.ponType					= 'GPON';
			this.loidStatus				= 'init';
			this.PonState 				= 'down';
			this.FECEnable 				= '-';
			this.WarnInfo 				= 'disconnect';
			this.PonSendPkt 			= '1000';
			this.PonRecvPkt 			= '2000';
			this.SendPower 				= '-';
			this.RecvPower 				= '-';
			this.WorkVoltage 			= (Number(SupplyVoltage)/10);
			this.WorkElectric 		= (Number(TxBiasCurrent)*2/1000);
			this.WorkTemperature 	= transTemperature(Temperature);
			this.EncryptEnable 		= '-';
			this.encryptState			= '0';
			this.GemPortInfo			= '1:1#';
			this.DispGemPortState = DispGemPortState;
			this.phyStatus				=	'down';
			this.PonUpTime				=	'0';
			this.PonMode					=	'1';
			this.Loid				=	'';
			this.PonSendBytes 		= '100000';
			this.PonRecvBytes 		= '200000';

			this.PonUpTime = formatSeconds(this.PonUpTime);

			if ( 'GPON' != this.ponType && 'EPON' != this.ponType )
				this.ponType = 'GPON';
			if ( 'GPON' == this.ponType )
			{
				this.loidAuth					= '1';
				this.loidV1						= '';
			}
			else
			{
				this.loidAuth					= '';
				this.loidV1						= '';
			}

			if ( 'up' == this.trafficstate )
			{
				this.PonState 				= 'up';
				this.WarnInfo 				= 'no info';
				this.loidStatus				= 'up';
			}
			else
			{
				if ( '0' != this.LinkSta && '2' == this.loidAuth && 0 != this.loidV1.length )
					this.loidStatus			= 'error';
			}

			if( '0' != this.LinkSta)
			{
				this.SendPower 				= (Math.round(Math.log((Number(TxPower))/10000)/(Math.log(10))*100)/10);
				this.RecvPower 				= (Math.round(Math.log((Number(RxPower))/10000)/(Math.log(10))*100)/10);
				this.FECEnable 				= ( '1' == this.fecState ) ? 'enabled' : 'disabled';

				if ( '2' == this.LinkSta )
					this.EncryptEnable	= ( '1' == this.encryptState ) ? 'enabled' : 'disabled';
			}
			function DispGemPortState()
			{
				var gemportList;
				var gemportInfo;
				var gemportState;
				var i = 0;

				if ( this.GemPortInfo.indexOf('#') >=0 )
					this.GemPortInfo = this.GemPortInfo.substring(0, this.GemPortInfo.length - 1);
				else
				{
					document.write('关闭');
					return -1;
				}

				gemportList = this.GemPortInfo.split('#');
				for (i = 0; i < gemportList.length; i ++)
				{
					gemportInfo = gemportList[i].split(':');
					if ( 2 != gemportInfo.length )
						continue;

					gemportState = 'GEMPORT' + gemportInfo[0] + ':' + ( ( 1 == gemportInfo[1] ) ? '启用' : '关闭' )
												+ '; '
					document.write(gemportState);
				}

				return 0;
			}
		}

		var PonInfo = new PonInfoClass();

		var EthernetState = 'down';

function get_pontype()
{
  var pon_type = "GPON";
  if( PonInfo.phyStatus == "gpon_phy_up" || PonInfo.phyStatus == "gpon_phy_down" )
  	pon_type = "GPON";
  else if( PonInfo.phyStatus == "epon_phy_up" || PonInfo.phyStatus == "epon_phy_down" )
  	pon_type = "EPON";
  	
  if( PonInfo.PonMode != "1" && PonInfo.PonMode != "2" && PonInfo.PonMode != "0" )
  {              	
  	if( PonInfo.PonMode == "6" )
  		pon_type = "XG-PON";
    else if( PonInfo.PonMode == "7" )
        pon_type = "XGS-PON";
	else if( PonInfo.PonMode == "5" )
  		pon_type = "EPON";
	else
  		pon_type = "10G-EPON";
  }
  	
  /* no pon info */
  if ( 'down' == PonInfo.phyStatus )
  {
  	switch ( PonInfo.PonMode )
  	{
  		case "1":
	  		pon_type = "GPON";
	  		break;
			case "2":
	  		pon_type = "EPON";
	  		break;
	  	case "3":
	  	case "4":
		  	pon_type = "10G-EPON";
		  	break;
	  	case "5":
		  	pon_type = "EPON";
		  	break;
		  case "6":
		  	pon_type = "XG-PON";
		  	break;
		  case "7":
		  	pon_type = "XGS-PON";
		  	break;
  	}
  }
  	
  var is_up_link_sfp_choose = 'No';
  var is_active_tther_wan = 'No';
  var ae_wan_speed = 'N/A';
  if ( is_up_link_sfp_choose == 'Yes' && is_active_tther_wan == 'Yes' )
  {
    if ( PonInfo.PonMode == "3" )
    {
        if (ae_wan_speed == "1000M")
        {
            pon_type = "GE";
        }
        else if (ae_wan_speed == "10000M")
        {
            pon_type = "10GE";
        }
        else
        {
            pon_type = "GE/10GE";
        }
    }
  }

  return pon_type;	
}			

      </SCRIPT>
